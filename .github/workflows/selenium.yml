name: Cucumber Selenium Tests

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC8

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        env:
          SELENIUM_OCTO1_USERNAME: ${{ secrets.SELENIUM_OCTO1_USERNAME }}
          SELENIUM_OCTO1_PASSWORD: ${{ secrets.SELENIUM_OCTO1_PASSWORD }}
          SELENIUM_OCTO2_USERNAME: ${{ secrets.SELENIUM_OCTO2_USERNAME }}
          SELENIUM_OCTO2_PASSWORD: ${{ secrets.SELENIUM_OCTO2_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: mvn -q test

      # Generate Allure HTML report even if tests fail
      - name: Generate Allure report
        if: always()
        run: mvn -q io.qameta.allure:allure-maven:report

      # Upload results + report as artifacts
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report